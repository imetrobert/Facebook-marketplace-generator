# Runs the browser tests and refreshes docs/code-map.md. On every push that touches the app code, and weekly
# (so a drift such as a retired Gemini model name or a changed library shows up as a red run).
name: Checks

on:
  push:
    branches: [main]
    paths: ['js/**', 'index.html', 'css/**', 'tests/**', 'supabase/**', 'scripts/**', 'package.json']
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checks
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Refresh the code map
        run: |
          python3 scripts/code_map.py
          if ! git diff --quiet -- docs/code-map.md; then
            git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
            git add docs/code-map.md
            git commit -m "Refresh docs/code-map.md [skip ci]"
            git push || echo "push skipped"
          fi
